<!DOCTYPE html><html lang="tl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Parts | The Republic of PC Gamers</title><link rel="stylesheet" href="style.css"><script src="app.js"></script></head>
<body><div class="wrap"><div class="box" style="text-align:center;margin-bottom:20px;background:linear-gradient(135deg,#1c0b3a,#07253a)"><h1 class="glow">ALL PC PARTS</h1><p style="opacity:.8;margin:8px">Old, new, at upcoming parts — lahat nandito.</p><button class="btn" style="font-size:20px;padding:16px 40px" onclick="location='builder.html'">🔥 LET'S BUILD 🔥</button></div>
<input id="q" placeholder="🔍 Search parts..." oninput="r()"><div id="fc" style="display:flex;gap:8px;flex-wrap:wrap;margin:10px 0"></div><div id="ft" style="display:flex;gap:8px;margin-bottom:16px"></div><div class="grid" id="g"></div></div>
<script>nav('p');let C='ALL',T='all';
const mk=(id,arr,get,set)=>{$(id).innerHTML=arr.map(a=>`<button class="chip ${get()==a?'on':''}" data-v="${a}">${a.toUpperCase()}</button>`).join('');$$('.chip',$(id)).forEach(b=>b.onclick=()=>{set(b.dataset.v);r()})};
function r(){mk('#fc',['ALL','CPU','GPU','RAM','SSD','MOBO','PSU','CASE','COOLER'],()=>C,v=>C=v);mk('#ft',['all','old','new','soon'],()=>T,v=>T=v);const q=$('#q').value.toLowerCase();
$('#g').innerHTML=D.filter(d=>(C=='ALL'||d.c==C)&&(T=='all'||d.t==T)&&(d.n+d.s).toLowerCase().includes(q)).map(d=>`<div class="card" onclick="toast('${d.n}: ${d.s}')">${art(d.c,d.t)}<span class="tag ${d.t}">${TN[d.t]}</span><h4 style="margin:6px 0">${d.n}</h4><small style="opacity:.7">${d.s}</small><div style="color:var(--p);font-weight:800;margin-top:6px">${d.p}</div></div>`).join('')||'<p>Walang nahanap 😢</p>'}r()</script></body></html>
