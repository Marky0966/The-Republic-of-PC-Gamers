<!DOCTYPE html><html lang="tl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Builder | The Republic of PC Gamers</title><link rel="stylesheet" href="style.css"><script src="app.js"></script></head>
<body><div class="wrap"><h1 class="glow">⚙️ PC BUILDER</h1><p style="opacity:.7">Pumili ng part sa bawat category.</p><div class="two"><div id="pick"></div><div style="position:sticky;top:70px;align-self:start"><div class="box"><div id="pc"></div><h3>📋 Specs</h3><div id="sp" style="font-size:14px"></div><h2 id="tot" style="color:var(--p)"></h2><button class="btn" onclick="save()">💾 SAVE BUILD</button> <button class="btn o" onclick="B={};r()">RESET</button></div><div class="box" style="margin-top:16px"><h3>🎮 Estimated FPS (1080p High)</h3><div id="fps"></div></div></div></div></div>
<script>nav('b');let B=JSON.parse(localStorage.rpg_b||'{}');const CT=['CPU','GPU','RAM','SSD','MOBO','PSU','CASE','COOLER'];
const G=[['Valorant',420],['CS2',380],['Fortnite',260],['GTA V',240],['Elden Ring',120],['Cyberpunk 2077',100]];
function pc(){const L=c=>B[c]?TC[D[B[c]].t]:'#333';return`<svg viewBox="0 0 200 220"><rect x="30" y="10" width="140" height="200" rx="10" fill="#0b0b18" stroke="${L('CASE')}" stroke-width="4"/><rect x="40" y="20" width="120" height="150" fill="${L('CASE')}" opacity=".12"/><rect x="48" y="28" width="46" height="46" rx="4" fill="${L('CPU')}" opacity=".9"/><circle cx="130" cy="52" r="20" fill="none" stroke="${L('COOLER')}" stroke-width="5"/><rect x="48" y="100" width="104" height="26" rx="5" fill="${L('GPU')}"/><rect x="112" y="30" width="6" height="40" fill="${L('RAM')}"/><rect x="122" y="30" width="6" height="40" fill="${L('RAM')}" /><rect x="48" y="140" width="40" height="8" fill="${L('SSD')}"/><rect x="40" y="176" width="120" height="26" fill="${L('PSU')}" opacity=".8"/><rect x="48" y="80" width="30" height="6" fill="${L('MOBO')}"/></svg>`}
function r(){$('#pick').innerHTML=CT.map(c=>`<h3 style="margin:16px 0 8px">${c}</h3><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(150px,1fr))">${D.filter(d=>d.c==c).map(d=>`<div class="card ${B[c]===d.id?'sel':''}" onclick="B['${c}']=B['${c}']===${d.id}?undefined:${d.id};r()">${art(c,d.t)}<span class="tag ${d.t}">${TN[d.t]}</span><div style="font-size:13px;margin-top:4px">${d.n}</div><b style="color:var(--p);font-size:13px">${d.p}</b></div>`).join('')}</div>`).join('');
$('#pc').innerHTML=pc();const s=CT.filter(c=>B[c]!==undefined);$('#sp').innerHTML=s.map(c=>`<div><b>${c}:</b> ${D[B[c]].n} — <span style="opacity:.7">${D[B[c]].s}</span></div>`).join('')||'Wala pang napipili.';
let t=0,tba=0;s.forEach(c=>{const p=D[B[c]].p.replace(/[^\d]/g,'');p?t+=+p:tba=1});$('#tot').textContent='Total: ₱'+t.toLocaleString()+(tba?' + TBA':'');
const cp=B.CPU!==undefined?D[B.CPU].sc:0,gp=B.GPU!==undefined?D[B.GPU].sc:0,ok=cp&&gp,ram=B.RAM!==undefined?1:.8,sc=ok?(Math.min(gp,cp*1.6)*.75+cp*.25)/100*ram:0;
$('#fps').innerHTML=ok?G.map(g=>{const f=Math.round(Math.min(g[1],g[1]*sc*(g[1]>200?.6:1)));return`<div>${g[0]}: <b>${f} FPS</b></div><div class="bar"><i style="width:${Math.min(100,f/g[1]*100)}%"></i></div>`}).join(''):'Pumili ng CPU at GPU para makita ang FPS.';localStorage.rpg_b=JSON.stringify(B)}
function save(){snd('ok');toast('Build saved! 🎉')}r()</script></body></html>
