<!DOCTYPE html><html lang="tl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Republic of PC Gamers</title><link rel="stylesheet" href="style.css"><script src="app.js"></script></head>
<body><div class="wrap" style="max-width:440px;padding-top:6vh;text-align:center"><div id="lg" style="filter:drop-shadow(0 0 20px #00e5ff)"></div><h1 class="glow" style="font-size:30px;letter-spacing:3px">THE REPUBLIC<br>OF PC GAMERS</h1><p style="opacity:.7;margin:8px 0 18px">Build your dream rig. Rule the republic.</p>
<div class="box" style="text-align:left"><h2>⚡ Login / Sign up</h2><input id="n" placeholder="Gamer name"><input id="e" type="email" placeholder="Email"><input id="pw" type="password" placeholder="Password"><button class="btn" style="width:100%;margin-top:8px" onclick="go($('#n').value||$('#e').value.split('@')[0],'email')">ENTER THE REPUBLIC</button>
<p style="text-align:center;opacity:.6;margin:12px">— or continue with —</p><div class="soc"><button onclick="go('Google Gamer','g')">G Google</button><button onclick="go('Facebook Gamer','f')">f Facebook</button><button onclick="go('Apple Gamer','a')"> Apple</button></div></div></div>
<script>$('#lg').innerHTML=logo(120);if(user())location='parts.html';
function go(n,w){if(w=='email'&&(!$('#e').value||!$('#pw').value))return toast('Fill in email & password!');localStorage.rpg_user=JSON.stringify({name:n.trim()||'Gamer',via:w});snd('ok');toast('Welcome, '+n+'!');setTimeout(()=>location='parts.html',600)}</script></body></html>
